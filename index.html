<!DOCTYPE html>
<html>
<head>
  <title>My Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>My Notebook</h1>

  <textarea id="noteInput" placeholder="Write a note here..."></textarea>

  <script src="script.js"></script>
</body>
</html>
